name: sci_environment
channels:
  - conda-forge
dependencies:
  - python=3.13
  - r-base=4.5
  - rpy2
  - pip
  - pip:
    - anndata
    - scanpy
    - numpy
    - pandas
    - scipy
    - matplotlib
    - seaborn
    - scikit-learn
    - statsmodels
    - tqdm
    - h5py
    - pyarrow
    - fastparquet
    - ipykernel
    - jupyterlab
    - umap-learn
    - upsetplot
    - plotly
    - pyteomics
    - mudata
    - openpyxl
    - lxml
    - pyyaml
    - requests
    - scib-metrics
    - joblib